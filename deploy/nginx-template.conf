log_format dshauth '$remote_addr [$time_local] "$request" $status origin="$http_origin" host="$host" xfh="$http_x_forwarded_host" referer="$http_referer"';
server {
    listen [::]:8443 ssl;
    server_name login.example.com;
    access_log /var/log/nginx/dsh-auth.log dshauth;

    ssl_certificate /etc/letsencrypt/live/login.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/login.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    client_max_body_size 512m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /auth/login {
        proxy_pass http://127.0.0.1:31322/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /auth/admin {
        proxy_pass http://127.0.0.1:31322/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/admin/update {
        proxy_pass http://127.0.0.1:31322/admin/update;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/admin/preferences {
        proxy_pass http://127.0.0.1:31322/admin/preferences;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/admin/background {
        proxy_pass http://127.0.0.1:31322/admin/background;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/admin/turnstile/start {
        proxy_pass http://127.0.0.1:31322/admin/turnstile/start;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/turnstile-check {
        proxy_pass http://127.0.0.1:31322/turnstile-check;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /auth/background/ {
        proxy_pass http://127.0.0.1:31322/background/;
        proxy_set_header Host $host;
    }

    location = /auth/customization {
        proxy_pass http://127.0.0.1:31322/customization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }

    location = /auth/logout {
        proxy_pass http://127.0.0.1:31322/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_dsh_auth_check {
        internal;
        proxy_pass http://127.0.0.1:31322/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /auth/ {
        return 404;
    }

    location = /dsh {
        return 302 /dsh/;
    }

    location /dsh/ {
        auth_request /_dsh_auth_check;
        error_page 401 = @dsh_login;
        proxy_pass http://127.0.0.1:31321/;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:31321";
        proxy_set_header Origin "http://127.0.0.1:31321";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/snippets/dsh-cookie.conf;
    }

    location / {
        auth_request /_dsh_auth_check;
        error_page 401 = @dsh_login;
        proxy_pass http://127.0.0.1:31321;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:31321";
        proxy_set_header Origin "http://127.0.0.1:31321";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/snippets/dsh-cookie.conf;
    }

    location @dsh_login {
        return 302 /auth/login;
    }
}
